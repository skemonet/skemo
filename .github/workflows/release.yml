name: Release
# A vX.Y.Z[-rc.N] tag builds the `skemo` binary for every platform (C-NF-1) and publishes a GitHub
# release: one asset per platform, the binary itself, and the SHA-256 of each in the release's
# description (C-NF-4). The licences of what the binary embeds (fonts, icons, crates) are printed by
# `skemo licences`. A tag containing a hyphen (-rc.1…) gives a pre-release. The publication uses the
# repository's GITHUB_TOKEN (permission contents: write).
on:
  push:
    tags: ["v*"]

# The quality and security pipeline (ci.yml: the same checks as locally with `tools/ci.sh`)
# must succeed before anything is built: a tag that does not pass publishes nothing.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset: the file name in the release, the same from one version to the next (the release
          # carries the version), so that releases/latest/download/<asset> is a stable link
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, asset: skemo-linux-x86_64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, asset: skemo-linux-arm64 }
          - { target: aarch64-apple-darwin, os: macos-latest, asset: skemo-macos-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, asset: skemo-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # psm (pest's growable stack, through elk-rs) assembles native code
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p skemo-cli --target ${{ matrix.target }}
      - name: Binary
        shell: bash
        run: |
          exe=skemo; [ "${{ runner.os }}" = Windows ] && exe=skemo.exe
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$exe" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skemo-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          # the description: what to download, and the SHA-256 of each binary, one line each
          {
            echo "One binary per platform: download it, make it executable, run it."
            echo
            echo "| Your machine | File |"
            echo "|---|---|"
            echo "| Linux, Intel or AMD | \`skemo-linux-x86_64\` |"
            echo "| Linux, ARM (Raspberry Pi 4/5, Graviton…) | \`skemo-linux-arm64\` |"
            echo "| Mac with Apple silicon (M1 and later) | \`skemo-macos-arm64\` |"
            echo "| Windows, Intel or AMD | \`skemo-windows-x86_64.exe\` |"
            echo
            echo "Linux and macOS in one line: \`curl -fsSL https://raw.githubusercontent.com/skemonet/skemo/main/cli/install.sh | sh\`"
            echo
            echo "Check it against its line below (\`sha256sum -c\`, or \`shasum -a 256 -c\` on macOS)."
            echo "The licences of what it embeds (fonts, icons, Rust crates): \`skemo licences\`."
            echo
            echo '```'
            (cd dist && sha256sum skemo-*)
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "skemo $GITHUB_REF_NAME" --notes-file notes.md $pre
