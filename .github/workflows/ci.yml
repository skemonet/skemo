# The checks live in tools/ci.sh (identical locally: `tools/ci.sh`). Quality and security run in
# parallel; a vX.Y.Z tag also triggers the pipeline, and the release requires it (workflow_call).
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    # the coverage stage rebuilds the workspace instrumented: about 45 min on a cold cache
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with: { tool: "wasm-bindgen-cli@0.2.129,cargo-llvm-cov" }
      - run: tools/ci.sh quality

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with: { tool: "cargo-deny" }
      # install-action does not ship actionlint: the release binary, checked against its SHA-256
      - name: actionlint
        run: |
          v=1.7.8; f="actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/rhysd/actionlint/releases/download/v$v/$f"
          echo "be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a  $f" | sha256sum -c
          tar xzf "$f" actionlint && mv actionlint "$HOME/.cargo/bin/" && rm "$f"
      - run: tools/ci.sh security
