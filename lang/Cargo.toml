[package]
name = "skemo-lang"
version = "0.1.0-rc.4"
edition = "2024"
description = "The skemo diagram language: format, parser, model, diagnostics, styles"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["diagram", "dsl", "parser", "css", "pug"]
categories = ["parser-implementations", "visualization"]
publish = false   # not published on crates.io yet

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
insta = "1"

[lints]
workspace = true
