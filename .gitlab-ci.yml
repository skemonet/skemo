# The skemo pipeline, run by the maintainers' CI (gitlab-ci-local with podman; no GitLab server).
# Every push runs the checks of tools/ci.sh (identical locally: `tools/ci.sh`); a vX.Y.Z tag also
# builds the four binaries and publishes them in the GitHub release of the tag (tools/release.sh).
#
# Images (built by the CI's ci-images repository): skemo-check for tools/ci.sh (rustfmt, clippy,
# llvm-tools, cargo-llvm-cov, cargo-deny, the wasm32 target, wasm-bindgen-cli 0.2.129 as engine-wasm,
# Node.js); rust for the binaries (cargo-zigbuild; musl, darwin and windows-gnu targets).
# Secret (tag pipelines only): GITHUB_TOKEN, allowed to write the contents of skemonet/skemo.

variables:
  GITHUB_REPO: skemonet/skemo
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always

stages: [check, build, release]

default:
  image: localhost/ci/skemo-check:1
  cache:
    key: cargo-registry
    paths: [.cargo-home/registry/]

quality:
  stage: check
  script:
    - tools/ci.sh quality

security:
  stage: check
  script:
    - tools/ci.sh security

# The four binaries, one after the other (the CI's memory is shared between jobs).
build:
  stage: build
  image: localhost/ci/rust:1.99.1-4
  needs: [quality, security]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    - mkdir -p dist
    - |
      set -e
      while read -r target asset exe; do
        echo "== $target -> $asset"
        cargo zigbuild --release --locked -p skemo-cli --target "$target"
        cp "target/$target/release/$exe" "dist/$asset"
      done <<EOF
      x86_64-unknown-linux-musl skemo-linux-x86_64 skemo
      aarch64-unknown-linux-musl skemo-linux-arm64 skemo
      aarch64-apple-darwin skemo-macos-arm64 skemo
      x86_64-pc-windows-gnu skemo-windows-x86_64.exe skemo.exe
      EOF
    - ls -l dist && sha256sum dist/*
    # the Linux x86_64 binary runs here: it must start and render
    - dist/skemo-linux-x86_64 --version
  artifacts:
    paths: [dist/]

release:
  stage: release
  image: localhost/ci/release:1
  needs: [build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  cache: []
  script:
    - sh tools/release.sh
