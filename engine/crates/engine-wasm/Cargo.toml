[package]
name = "skemo-engine-wasm"
version.workspace = true
edition.workspace = true
description = "skemo engine in WebAssembly: render(source, css, options) → html, svg, layout, diagnostics"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["diagram", "wasm", "svg", "rendering"]
categories = ["wasm", "visualization"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skemo-engine = { path = "../engine", default-features = false }
skemo-lang.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
