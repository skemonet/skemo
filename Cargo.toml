[workspace]
members = ["router", "lang", "engine/crates/engine", "engine/crates/engine-wasm", "cli"]
# the router's browser demo is a crate of its own (wasm-bindgen, built by demo/wasm/build.sh)
exclude = ["router/demo/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skemonet/skemo"
homepage = "https://skemo.net"

[workspace.dependencies]
# Sibling crates of the project, by path
skemo-lang = { path = "lang" }
skemo-router = { path = "router" }
# Layout: elk-rs (EPL-2.0), pinned to a revision
org-eclipse-elk-graph-json = { git = "https://github.com/openedges/elk-rs", rev = "10714ffa852f38bad9192510c4bfbcc9fa207e2b" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Readability and refactoring (Fowler): short functions, little nesting, no duplication.
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
match_same_arms = "warn"
manual_let_else = "warn"
single_match_else = "warn"
redundant_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
unnested_or_patterns = "warn"
# Consistency
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
# No development leftovers
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# WebAssembly: optimised for size (F-WASM-5)
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
