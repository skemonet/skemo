# Minimal WebAssembly example (R3): the router called from a web page.
# A crate of its own: the router itself stays without dependency.
[package]
name = "router-wasm-demo"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
skemo-router = { path = "../.." }
wasm-bindgen = "=0.2.129"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
